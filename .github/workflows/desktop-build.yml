name: Desktop build verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/desktop-build.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pyproject.toml"
      - "scripts/**"
      - "src/**"
      - "src-tauri/**"
      - "ui/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/desktop-build.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pyproject.toml"
      - "scripts/**"
      - "src/**"
      - "src-tauri/**"
      - "ui/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: python -m pip install -e ".[test,packaging]"
      - run: pnpm install --frozen-lockfile
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - run: pnpm build
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            bundles: app,dmg
            artifact_name: macos-desktop-bundle
            artifact_path: |
              src-tauri/target/release/bundle/macos/*.app
              src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            bundles: nsis
            artifact_name: windows-desktop-bundle
            artifact_path: |
              src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: python -m pip install -e ".[test,packaging]"
      - run: pnpm install --frozen-lockfile
      - run: python scripts/build_sidecar.py
      - name: Verify Sidecar parent-process cleanup
        shell: bash
        run: |
          SIDECAR_NAME=$(python scripts/build_sidecar.py --dry-run | python -c "import json,sys; print(json.load(sys.stdin)['artifact'])")
          python scripts/verify_sidecar_parent_exit.py --sidecar "src-tauri/binaries/$SIDECAR_NAME"
      - run: pnpm tauri build --bundles "${{ matrix.bundles }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14
