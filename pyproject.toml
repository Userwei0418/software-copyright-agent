[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "software-copyright-agent"
version = "0.1.0"
description = "Local-first software copyright material generator"
requires-python = ">=3.9"
dependencies = ["python-docx>=1.1,<2", "Pillow>=10,<13"]

[project.scripts]
copyright-agent = "software_copyright_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
software_copyright_agent = ["assets/fonts/noto-cjk/*"]
