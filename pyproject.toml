[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "software-copyright-agent"
version = "0.1.0"
description = "Local-first software copyright material generator"
requires-python = ">=3.9"
dependencies = [
  "cryptography>=42,<47",
  "fastapi>=0.115,<1",
  "Pillow>=10,<13",
  "pydantic>=2.8,<3",
  "python-docx>=1.1,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]
packaging = ["pyinstaller>=6.10,<7"]

[project.scripts]
copyright-agent = "software_copyright_agent.cli:main"
copyright-agent-sidecar = "software_copyright_agent.sidecar:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
software_copyright_agent = ["assets/fonts/noto-cjk/*"]
